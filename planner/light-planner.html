<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://i.pinimg.com/736x/3a/8d/bd/3a8dbd93bb225880d32c09412fb05c13.jpg" type="image/gif" sizes="16x16" />
  <title>Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Ovo&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Ovo', serif;
      background: url('https://i.pinimg.com/736x/7d/d0/74/7dd074e560a62731c01bf9cf099dadb4.jpg') repeat;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }
    
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: -1;
    }
    
    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      padding: 40px;
      width: 90%;
      max-width: 1200px;
      z-index: 1;
    }
    
    .section {
      background: rgba(255, 231, 196, 0.21);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
    }
    
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .quote p {
      font-size: 16px;
      font-family: 'Playfair Display', serif;
    }
    
    textarea,
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: none;
      color: white;
      font-family: 'Ovo', serif;
      font-size: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      margin-bottom: 10px;
    }
    
    textarea::placeholder,
    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Ovo', serif;
    }
    
    textarea:focus,
    input[type="text"]:focus {
      outline: none;
      border-bottom: 1px solid white;
    }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      text-align: center;
    }
    
    .day {
      padding: 10px;
      text-align: center;
      transition: background 0.2s ease;
      cursor: pointer;
    }
    
    .day.today {
      font-weight: bold;
      border-radius: 50%;
      border: 0.5px solid white;
    }
    
    .vibe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }
    
    .vibe-item {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    
    li.removing {
      background: rgba(255, 231, 196, 0.5);
      opacity: 0.5;
      transition: background 0.5s ease-out, opacity 0.5s ease-out;
    }

    li.checked {
      text-decoration: line-through;
      color: rgba(255, 255, 255, 0.5);
    }

    #playBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background-color: transparent;
      color: rgba(255, 231, 196, 0.5);
      font-size: 20px;
      cursor: pointer;
      z-index: 1000;
      outline: none;
    }
  </style>
</head>
<body>
  <audio id="bgm" preload="auto" autoplay loop>
    <source src="https://t-mohin.github.io/website/planner/Minho%20and%20Kitty%20in%20the%20Rain.mp3" type="audio/mpeg" />
  </audio>

  <div class="container">
    <div class="column">
      <div class="section" id="applications">
        <h2 id="applications-title">Notes</h2>
        <textarea rows="21" placeholder="List notes here..."></textarea>
      </div>
      <div class="section quote">
        <p id="quote">"Who you were, who you are, and who you will be are three different people."</p>
      </div>
    </div>

    <div class="column">
      <div class="section">
        <h2>Goals</h2>
        <div id="goals">
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 1" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 2" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 3" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 4" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 5" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 6" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 7" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 8" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 9" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 10" /></div>
          <div class="goal-item"><input type="checkbox"> <input type="text" placeholder="Goal 11" /></div>
        </div>
      </div>
    </div>

    <div class="column">
      <div class="section">
        <h2 id="calendar-title"></h2>
        <div class="calendar-grid" id="calendar"></div>
      </div>
      <div class="section">
        <h2>Vibes</h2>
        <div class="vibe-grid">
          <img class="vibe-item" src="vibe1.jpg" alt="Vibe 1" />
          <img class="vibe-item" src="vibe.jpg" alt="Vibe 2" />
          <img class="vibe-item" src="vibe3.jpg" alt="Vibe 3" />
          <img class="vibe-item" src="vibe4.jpg" alt="Vibe 4" />
          <img class="vibe-item" src="vibe7.jpg" alt="Vibe 5" />
          <img class="vibe-item" src="vibe10.jpg" alt="Vibe 6" />
        </div>
      </div>
    </div>
  </div>

  <button id="playBtn" title="Play/Pause"></button>

  <script src="script.js"></script>

  <script>
    const quotes = [
      "Who you were, who you are, and who you will be are three different people.",
      "Every moment is a fresh beginning.",
      "Dream big and dare to fail.",
      "Act as if what you do makes a difference. It does."
    ];

    let quoteIndex = 0;
    const quoteElement = document.getElementById("quote");

    setInterval(() => {
      quoteIndex = (quoteIndex + 1) % quotes.length;
      quoteElement.textContent = quotes[quoteIndex];
    }, 5000);

    const calendarGrid = document.getElementById("calendar");
    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    const currentDate = new Date();
    const currentMonth = currentDate.getMonth();
    const currentYear = currentDate.getFullYear();

    document.getElementById("calendar-title").textContent = `${monthNames[currentMonth]} ${currentYear}`;

    function generateCalendar(month, year) {
      calendarGrid.innerHTML = "";
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const blankDay = document.createElement("div");
        blankDay.classList.add("day");
        calendarGrid.appendChild(blankDay);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement("div");
        dayElement.classList.add("day");
        dayElement.textContent = day;

        if (day === currentDate.getDate() && month === currentMonth && year === currentYear) {
          dayElement.classList.add("today");
        }

        calendarGrid.appendChild(dayElement);
      }
    }

    generateCalendar(currentMonth, currentYear);

    const audio = document.getElementById('bgm');
    const playBtn = document.getElementById('playBtn');

    playBtn.textContent = audio.paused ? '►' : '❚❚';

    playBtn.addEventListener('click', function () {
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.textContent = '❚❚';
        }).catch(err => {
          console.error("Playback failed:", err);
        });
      } else {
        audio.pause();
        playBtn.textContent = '►';
      }
    });

    audio.addEventListener('play', () => {
      playBtn.textContent = '❚❚';
    });
    audio.addEventListener('pause', () => {
      playBtn.textContent = '►';
    });

    const goalsList = document.getElementById('goals');

    goalsList.addEventListener('change', function (e) {
      if (e.target.matches('input[type="checkbox"]')) {
        const goalItem = e.target.closest('.goal-item');
        const goalText = goalItem.querySelector('input[type="text"]');
        if (e.target.checked) {
          goalText.classList.add('checked');
          setTimeout(() => {
            goalItem.classList.add('removing');
            setTimeout(() => {
              goalItem.remove();
            }, 300);
          }, 45000); // Remove after 45 seconds
        } else {
          goalText.classList.remove('checked');
          goalItem.classList.remove('removing');
        }
      }
    });
  </script>
</body>
</html>
