<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head> <link rel="icon" href="https://media.istockphoto.com/id/1372967662/vector/seamless-pattern-with-tulips-and-leaves-vector.jpg?s=612x612&w=0&k=20&c=XgTi2J0wY93GD7MKZaQLPzuvZovh3J5pFxxo3JMVf8U="
type="image/gif" sizes="16x16">
</head>
  <title>Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Ovo&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background Music -->
   <audio id="bgm" autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-slowmotion.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  
  <div class="container">
    <!-- Column 1: Applications + Quote -->
    <div class="column">
      <div class="section" id="applications">
        <h2 id="applications-title">Notes</h2>
        <textarea rows="21" placeholder="List notes here..."></textarea>
      </div>
      <div class="section quote">
        <p id="quote">"Who you were, who you are, and who you will be are three different people."</p>
      </div>
    </div>

    <!-- Column 2: Monthly Goals -->
    <div class="column">
      <div class="section">
        <h2>Goals</h2>
        <ul id="goals">
          <li><input type="text" placeholder="Goal 1"></li>
          <li><input type="text" placeholder="Goal 2"></li>
          <li><input type="text" placeholder="Goal 3"></li>
          <li><input type="text" placeholder="Goal 4"></li>
          <li><input type="text" placeholder="Goal 5"></li>
          <li><input type="text" placeholder="Goal 6"></li>
          <li><input type="text" placeholder="Goal 7"></li>
          <li><input type="text" placeholder="Goal 8"></li>
          <li><input type="text" placeholder="Goal 9"></li>
          <li><input type="text" placeholder="Goal 10"></li>
          <li><input type="text" placeholder="Goal 11"></li>
        </ul>
      </div>
    </div>

    <!-- Column 3: Calendar + Vibes -->
    <div class="column">
      <div class="section">
        <h2 id="calendar-title"></h2>
        <div class="calendar-grid" id="calendar"></div>
      </div>
      <div class="section">
        <h2>Vibes</h2>
        <div class="vibe-grid">
          <img class="vibe-item" src="vibe.jpg" alt="Vibe 1">
          <img class="vibe-item" src="vibe10.jpg" alt="Vibe 2">
          <img class="vibe-item" src="vibe3.jpg" alt="Vibe 3">
          <img class="vibe-item" src="vibe4.jpg" alt="Vibe 4">
          <img class="vibe-item" src="vibe7.jpg" alt="Vibe 5">
          <img class="vibe-item" src="vibe6.jpg" alt="Vibe 6">
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<style>
body {
  font-family: 'Ovo', serif;
  background: url('https://images.unsplash.com/photo-1714715362537-4aa538a6f0ab?q=80&w=2012&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
  background-size: cover;
  color: white;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  padding: 40px;
  width: 90%;
  max-width: 1200px;
}

.section {
  background: rgba(0, 0, 0, 0.4);
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(10px);
  margin-bottom: 20px;
}

h2 {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  margin-bottom: 10px;
}

.quote p {
  font-size: 18px; /* Increased font size */
  font-family: 'Playfair Display', serif;
}

textarea,
input[type="text"] {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
  margin-bottom: 10px;
}

textarea::placeholder,
input[type="text"]::placeholder {
  color: rgba(255, 255, 255, 0.7);
}

textarea:focus,
input[type="text"]:focus {
  outline: none;
  border-bottom: 1px solid white;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  text-align: center;
}

.day {
  padding: 15px;
  text-align: center;
  border-radius: 50%;
  border: 1px solid black; /* Black outline for other days */
  transition: background 0.2s ease;
  cursor: pointer;
}

.day.today {
  font-weight: bold;
  border: 1px solid white; /* White outline for the current day */
}

.vibe-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-height: 200px;
  overflow-y: auto;
}

.vibe-item {
  width: 100%;
  height: 80px;
  object-fit: cover;
  border-radius: 8px;
  transition: transform 0.3s ease;
}

@media (max-width: 768px) {
.container {
    grid-template-columns: 1fr;
    align-items: center;
}
</style>

<script>
window.addEventListener('load', () => {
      const bgm = document.getElementById('bgm');
      bgm.play().catch(error => {
        console.log('Autoplay blocked, user interaction required:', error);
      });
    });
// Rotating Quotes
const quotes = [
  "Who you were, who you are, and who you will be are three different people.",
  "Every moment is a fresh beginning.",
  "Dream big and dare to fail.",
  "Act as if what you do makes a difference. It does."
];

let quoteIndex = 0;
const quoteElement = document.getElementById("quote");

setInterval(() => {
  quoteIndex = (quoteIndex + 1) % quotes.length;
  quoteElement.textContent = quotes[quoteIndex];
}, 5000);

// Calendar Auto-Update
const calendarGrid = document.getElementById("calendar");
const monthNames = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"
];

const currentDate = new Date();
const currentMonth = currentDate.getMonth();
const currentYear = currentDate.getFullYear();

// Update titles with the current month and year
document.getElementById("calendar-title").textContent = `${monthNames[currentMonth]} ${currentYear}`;

// Generate calendar days for the current month
function generateCalendar(month, year) {
  calendarGrid.innerHTML = ""; // Clear existing days
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Add blank spaces for alignment
  for (let i = 0; i < firstDay; i++) {
    const blankDay = document.createElement("div");
    blankDay.classList.add("day");
    calendarGrid.appendChild(blankDay);
  }

  // Add days with an outlined circle for today's date only
  for (let day = 1; day <= daysInMonth; day++) {
    const dayElement = document.createElement("div");
    dayElement.classList.add("day");
    dayElement.textContent = day;

    if (day === currentDate.getDate() && month === currentMonth && year === currentYear) {
      dayElement.classList.add("today");
    }

    calendarGrid.appendChild(dayElement);
  }
}

generateCalendar(currentMonth, currentYear);
</script>
